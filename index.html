<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>PD Margin Board</title>
<style>
:root{color-scheme:light}
html,body{margin:0;background:#F4F6F9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#0F172A}
.gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(1200px 600px at 20% 0%,#E6F1FB 0%,#F4F6F9 55%)}
.card{width:min(390px,100%);background:#fff;border:1px solid #E3E7ED;border-radius:20px;padding:32px 28px 22px;box-shadow:0 24px 60px -24px rgba(15,23,42,.35);display:flex;flex-direction:column;gap:10px;box-sizing:border-box}
.card img{width:190px;align-self:center;margin-bottom:6px}
h1{margin:0;text-align:center;font-weight:800;font-size:20px;letter-spacing:-.02em}
p{margin:-6px 0 4px;text-align:center;color:#64748B;font-size:13px}
form{display:flex;flex-direction:column;gap:12px}
input[type=password]{font:inherit;font-size:15px;padding:12px 14px;border:1px solid #CBD5E1;border-radius:12px;outline:none}
input[type=password]:focus{border-color:#1B75BC;box-shadow:0 0 0 4px rgba(27,117,188,.15)}
label{display:flex;gap:8px;align-items:center;font-size:13px;color:#475569}
button{font:inherit;font-weight:700;font-size:15px;padding:12px;border:0;border-radius:12px;background:#1B75BC;color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:progress}
button:focus-visible,input:focus-visible{outline:2px solid #1B75BC;outline-offset:2px}
.err{min-height:1.2em;color:#C62828;font-size:13px;text-align:center}
.tag{align-self:center;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:#C62828;border:1px solid #C62828;border-radius:999px;padding:2px 9px}
</style>
</head>

    <h1>PD Margin Board</h1>
    <span class="tag">Internal · PD team only</span>
    <p>Enter the margin board password.</p>
    <form id="f" autocomplete="on">
      <input type="text" name="username" value="pd-margin-board" autocomplete="username" hidden>
      <input type="password" id="pw" autocomplete="current-password" placeholder="Password" required>
      <label><input type="checkbox" id="rem" checked> Keep me signed in on this device</label>
      <button type="submit" id="go">Open</button>
      <div class="err" id="err" role="alert"></div>
    </form>
  </div>
</div>
<script>
(function(){
  var b64=function(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})};
  var tob64=function(u){var s="";u.forEach(function(x){s+=String.fromCharCode(x)});return btoa(s)};
  async function open(key,bytes){var iv=bytes.slice(0,12),ct=bytes.slice(12);return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:iv},key,ct))}
  async function aes(raw){return crypto.subtle.importKey("raw",raw,{name:"AES-GCM"},false,["decrypt"])}
  async function keyFromPassword(pw){
    var m=await (await fetch("data/meta.json",{cache:"no-cache"})).json();
    var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    var wk=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(m.salt),iterations:m.iterations,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
    return open(wk,b64(m.wrapped));
  }
  async function show(raw){
    var txt=await (await fetch("data/pdm.enc",{cache:"no-cache"})).text();
    var page=new TextDecoder().decode(await open(await aes(raw),b64(txt.trim())));
    var bar='<div style="max-width:1180px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px));text-align:right"><a href="#" id="pdm-out" style="font:600 13px -apple-system,Segoe UI,Arial,sans-serif;color:#1B75BC;text-decoration:none">Sign out</a></div>';
    document.open();
    document.write('<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"></head><body>'+page+bar+'<script>document.getElementById("pdm-out").onclick=function(e){e.preventDefault();try{localStorage.removeItem("pdm-key")}catch(x){}location.reload()}<\/script></body></html>');
    document.close();
  }
  var saved=null; try{saved=localStorage.getItem("pdm-key")}catch(e){}
  if(saved){ show(b64(saved)).catch(function(){try{localStorage.removeItem("pdm-key")}catch(e){}; location.reload()}); }
  document.getElementById("f").addEventListener("submit",async function(e){
    e.preventDefault(); var go=document.getElementById("go"), err=document.getElementById("err");
    go.disabled=true; err.textContent="";
    try{
      var raw=await keyFromPassword(document.getElementById("pw").value);
      if(document.getElementById("rem").checked) try{localStorage.setItem("pdm-key",tob64(raw))}catch(x){}
      await show(raw);
    }catch(x){ err.textContent="That password isn't right."; go.disabled=false; }
  });
})();
</script>
